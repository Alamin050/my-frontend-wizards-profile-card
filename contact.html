<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Alamin Muhammad</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://maxst.icons8.com/vue-static/landings/line-awesome/line-awesome/css/line-awesome.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Navigation -->
    <header class="navbar">
      <nav>
        <div class="nav-content">
          <a href="index.html"class="active">Home</a>
          <a href="about.html" >About</a>
          <a href="contact.html">Contact</a>
        </div>
          
        
      </nav>
    </header>

    <!-- Contact Form -->
    <main class="contact-container">
      <h1>Contact Us</h1>

      <form id="contactForm" novalidate>
        <!-- Full Name -->
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            data-testid="test-contact-name"
            aria-describedby="error-name"
            required
          />
          <small id="error-name" data-testid="test-contact-error-name"></small>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            data-testid="test-contact-email"
            aria-describedby="error-email"
            required
          />
          <small id="error-email" data-testid="test-contact-error-email"></small>
        </div>

        <!-- Subject -->
        <div class="form-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            name="subject"
            data-testid="test-contact-subject"
            aria-describedby="error-subject"
            required
          />
          <small id="error-subject" data-testid="test-contact-error-subject"></small>
        </div>

        <!-- Message -->
        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            data-testid="test-contact-message"
            aria-describedby="error-message"
            required
          ></textarea>
          <small id="error-message" data-testid="test-contact-error-message"></small>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          data-testid="test-contact-submit"
          class="btn-submit"
        >
          Send Message
        </button>

        <!-- Success Message -->
        <p
          id="success-message"
          data-testid="test-contact-success"
          class="success-message"
        ></p>
      </form>
    </main>

    <footer>
      <p>© 2025 Alamin Muhammad</p>
    </footer>

    <script src="contact.js"></script>
  </body>
</html>
